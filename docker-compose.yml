services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-fitpilot}
      POSTGRES_USER: ${DB_USERNAME:-fitpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports: ["9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-fitpilot}
      DB_USERNAME: ${DB_USERNAME:-fitpilot}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      IDEMPOTENCY_ENABLED: ${IDEMPOTENCY_ENABLED:-true}
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      EVENT_OPERATIONS_TOKEN: ${EVENT_OPERATIONS_TOKEN:-}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:?OPERATIONS_TOKEN must be set}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_ELASTICSEARCH_URL: http://elasticsearch:9200
      RAG_OPERATIONS_TOKEN: ${RAG_OPERATIONS_TOKEN:?RAG_OPERATIONS_TOKEN must be set}
      AGENT_OPERATIONS_TOKEN: ${AGENT_OPERATIONS_TOKEN:?AGENT_OPERATIONS_TOKEN must be set}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PRIMARY_URL: ${LLM_PRIMARY_URL:-}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
      LLM_PRIMARY_SMALL_MODEL: ${LLM_PRIMARY_SMALL_MODEL:-}
      LLM_PRIMARY_MEDIUM_MODEL: ${LLM_PRIMARY_MEDIUM_MODEL:-}
      LLM_PRIMARY_STRONG_MODEL: ${LLM_PRIMARY_STRONG_MODEL:-}
      LLM_FALLBACK_URL: ${LLM_FALLBACK_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_SMALL_MODEL: ${LLM_FALLBACK_SMALL_MODEL:-}
      LLM_FALLBACK_MEDIUM_MODEL: ${LLM_FALLBACK_MEDIUM_MODEL:-}
      LLM_FALLBACK_STRONG_MODEL: ${LLM_FALLBACK_STRONG_MODEL:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      LOG_FILE: /var/log/fitpilot/app.json
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-LOCAL}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ports: ["8080:8080"]
    volumes: ["app-logs:/var/log/fitpilot"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      app: {condition: service_healthy}
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
  promtail:
    image: grafana/promtail:3.5.3
    command: ["-config.file=/etc/promtail.yml"]
    volumes:
      - ./deploy/monitoring/promtail/promtail.yml:/etc/promtail.yml:ro
      - app-logs:/var/log/fitpilot:ro
      - promtail-positions:/tmp
    depends_on: [loki, app]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/monitoring/otel/collector.yml:/etc/otelcol/config.yml:ro
    depends_on: [tempo]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  app-logs:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  promtail-positions:
