name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and Testcontainers E2E
        run: mvn -B verify
      - name: Reject skipped tests
        shell: python
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          reports = glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml")
          skipped = sum(int(ET.parse(path).getroot().attrib.get("skipped", 0)) for path in reports)
          if not reports or skipped:
              raise SystemExit(f"expected test reports with zero skips, reports={len(reports)} skipped={skipped}")
      - name: OWASP dependency check
        run: >-
          mvn -B org.owasp:dependency-check-maven:12.1.3:check
          -DfailBuildOnCVSS=7 -DossindexAnalyzerEnabled=false
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Validate Compose and Kubernetes
        env:
          DB_PASSWORD: ci-database-password
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-bytes
          OPERATIONS_TOKEN: ci-operations-token
          RAG_OPERATIONS_TOKEN: ci-operations-token
          AGENT_OPERATIONS_TOKEN: ci-operations-token
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: |
          docker compose config --quiet
          kubectl kustomize deploy/k8s/overlays/production >/tmp/fitpilot-production.yml
          kubectl kustomize deploy/k8s/overlays/production-migration >/tmp/fitpilot-migration.yml
      - name: Build non-root image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_REVISION=${GITHUB_SHA} -t fitpilot:${GITHUB_SHA} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fitpilot:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-results.sarif}
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            target/site/jacoco/
            target/bom.json
            target/dependency-check-report.*
            trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

