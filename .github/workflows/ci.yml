name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Restore repository-local Maven cache
        uses: actions/cache@v5
        with:
          path: .mvn/repository
          key: maven-central-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-central-${{ runner.os }}-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          settings-path: ${{ runner.temp }}/fitpilot-maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            integrations/pi-coach/package-lock.json
      - name: Pi coach adapter tests
        working-directory: integrations/pi-coach
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Load-test account isolation regression
        run: node --experimental-vm-modules --test load-test/v5-users.test.mjs
      - name: V22 delivery gate regression
        shell: pwsh
        run: ./scripts/delivery/test-v22-rollout.ps1
      - name: Backend quality gate
        shell: pwsh
        env:
          MAVEN_ARGS: --settings ${{ runner.temp }}/fitpilot-maven/settings.xml
        run: ./scripts/run-quality-gate.ps1 -BackendOnly
      - name: Web quality gate
        shell: pwsh
        run: ./scripts/run-quality-gate.ps1 -WebOnly
      - name: Trivy dependency scan from CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          format: sarif
          output: trivy-dependency-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload dependency Trivy SARIF
        if: always() && hashFiles('trivy-dependency-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dependency-results.sarif
          category: dependency-sbom
      - name: Validate Compose and Kubernetes
        env:
          DB_PASSWORD: ci-database-password
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-bytes
          OPERATIONS_TOKEN: ci-operations-token
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          FITPILOT_PI_BRIDGE_KEY: ci-pi-bridge-key
          FITPILOT_PI_MODEL: ci-pi-model
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.pi.yml config --quiet
          kubectl kustomize deploy/k8s/overlays/production >/tmp/fitpilot-production.yml
          kubectl kustomize deploy/k8s/overlays/production-migration >/tmp/fitpilot-migration.yml
          kubectl kustomize deploy/k8s/overlays/production-schema-status >/tmp/fitpilot-schema-status.yml
          kubectl kustomize deploy/k8s/overlays/production-v22-migration >/tmp/fitpilot-v22-migration.yml
      - name: Validate Prometheus and Alertmanager
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "${PWD}/deploy/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Build non-root image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_REVISION=${GITHUB_SHA} -t fitpilot:${GITHUB_SHA} .
      - name: Build web image
        run: docker build -t fitpilot-web:${GITHUB_SHA} web
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fitpilot:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: application-image
      - name: Trivy web image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fitpilot-web:${{ github.sha }}
          format: sarif
          output: trivy-web-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload web Trivy SARIF
        if: always() && hashFiles('trivy-web-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web-results.sarif
          category: web-image
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            target/site/jacoco/
            target/bom.json
            trivy-dependency-results.sarif
            web/coverage/
            web/playwright-report/
            web/test-results/
            trivy-results.sarif
            trivy-web-results.sarif
            web/dist/
            /tmp/fitpilot-production.yml
            /tmp/fitpilot-migration.yml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
