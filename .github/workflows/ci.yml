name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend and web quality gate
        shell: pwsh
        run: ./scripts/run-quality-gate.ps1
      - name: OWASP dependency check
        run: >-
          mvn -B org.owasp:dependency-check-maven:12.1.3:check
          -DfailBuildOnCVSS=7 -DossindexAnalyzerEnabled=false
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Validate Compose and Kubernetes
        env:
          DB_PASSWORD: ci-database-password
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-bytes
          OPERATIONS_TOKEN: ci-operations-token
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: |
          docker compose config --quiet
          kubectl kustomize deploy/k8s/overlays/production >/tmp/fitpilot-production.yml
          kubectl kustomize deploy/k8s/overlays/production-migration >/tmp/fitpilot-migration.yml
      - name: Validate Prometheus and Alertmanager
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/deploy/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "${PWD}/deploy/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Build non-root image
        run: docker build --build-arg APP_VERSION=ci --build-arg GIT_REVISION=${GITHUB_SHA} -t fitpilot:${GITHUB_SHA} .
      - name: Build web image
        run: docker build -t fitpilot-web:${GITHUB_SHA} web
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fitpilot:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-results.sarif}
      - name: Trivy web image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fitpilot-web:${{ github.sha }}
          format: sarif
          output: trivy-web-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload web Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-web-results.sarif}
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            target/site/jacoco/
            target/bom.json
            target/dependency-check-report.*
            web/coverage/
            web/playwright-report/
            web/test-results/
            trivy-results.sarif
            trivy-web-results.sarif
            web/dist/
            /tmp/fitpilot-production.yml
            /tmp/fitpilot-migration.yml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
