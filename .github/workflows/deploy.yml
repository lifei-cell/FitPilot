name: Production Delivery Gate

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable FitPilot GHCR digest (sha256:...)
        required: true
      web_image_digest:
        description: Immutable FitPilot Web GHCR digest (sha256:...)
        required: true
      kube_context:
        description: Exact kubeconfig context allowed for this delivery
        required: true
        default: fitpilot-production
      rollback_drill:
        description: Roll back to the previous ReplicaSet and recover the candidate
        required: true
        type: boolean
        default: true
      backup_restore_drill:
        description: Restore a logical backup into the isolated restore database
        required: true
        type: boolean
        default: true
      secret_rotation_drill:
        description: Rotate JWT and Operations credentials with live verification
        required: true
        type: boolean
        default: true
      revoke_previous_jwt:
        description: Revoke the previous JWT key after the compatibility window
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: fitpilot-production-delivery
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      EVIDENCE_DIR: release-evidence
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/fitpilot@${{ inputs.image_digest }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fitpilot-web@${{ inputs.web_image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure exact production context
        env:
          KUBE_CONFIG_VALUE: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_VALUE"
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_VALUE" >~/.kube/config
          chmod 600 ~/.kube/config
          test "$(kubectl config current-context)" = '${{ inputs.kube_context }}'
      - name: Preflight delivery authority and secrets
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DELIVERY_SOURCE_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.DELIVERY_RESTORE_DATABASE_URL }}
          ROTATED_JWT_SECRET: ${{ secrets.ROTATED_JWT_SECRET }}
          ROTATED_OPERATIONS_TOKEN: ${{ secrets.ROTATED_OPERATIONS_TOKEN }}
        run: |
          set -euo pipefail
          [[ '${{ inputs.image_digest }}' =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ '${{ inputs.web_image_digest }}' =~ ^sha256:[a-f0-9]{64}$ ]]
          test -n "$SOURCE_DATABASE_URL"
          test -n "$RESTORE_DATABASE_URL"
          test -n "$ROTATED_JWT_SECRET"
          test -n "$ROTATED_OPERATIONS_TOKEN"
          test "$(kubectl auth can-i create jobs -n fitpilot)" = yes
          test "$(kubectl auth can-i patch deployments -n fitpilot)" = yes
          test "$(kubectl auth can-i patch secrets -n fitpilot)" = yes
      - name: Prepare isolated restore target
        if: inputs.backup_restore_drill
        shell: pwsh
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DELIVERY_SOURCE_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.DELIVERY_RESTORE_DATABASE_URL }}
        run: >-
          ./scripts/delivery/prepare-database-drill.ps1
          -KubeContext '${{ inputs.kube_context }}'
          -SourceDatabaseUrl $env:SOURCE_DATABASE_URL
          -RestoreDatabaseUrl $env:RESTORE_DATABASE_URL
      - name: Run migration, rollout, rollback, restore and rotation gates
        shell: pwsh
        env:
          ROTATED_JWT_SECRET: ${{ secrets.ROTATED_JWT_SECRET }}
          ROTATED_OPERATIONS_TOKEN: ${{ secrets.ROTATED_OPERATIONS_TOKEN }}
        run: |
          $parameters = @{
            KubeContext = '${{ inputs.kube_context }}'
            AppImage = $env:APP_IMAGE
            WebImage = $env:WEB_IMAGE
            RotatedJwtSecret = $env:ROTATED_JWT_SECRET
            RotatedOperationsToken = $env:ROTATED_OPERATIONS_TOKEN
            EvidenceDirectory = $env:EVIDENCE_DIR
          }
          if ('${{ inputs.rollback_drill }}' -eq 'true') { $parameters.RollbackDrill = $true }
          if ('${{ inputs.backup_restore_drill }}' -eq 'true') { $parameters.BackupRestoreDrill = $true }
          if ('${{ inputs.secret_rotation_drill }}' -eq 'true') { $parameters.SecretRotationDrill = $true }
          if ('${{ inputs.revoke_previous_jwt }}' -eq 'true') { $parameters.RevokePreviousJwt = $true }
          ./scripts/delivery/run-delivery-gate.ps1 @parameters
      - name: Collect final Kubernetes evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR"
          kubectl -n fitpilot get all -o wide >"$EVIDENCE_DIR/all.txt" 2>&1 || true
          kubectl -n fitpilot get events --sort-by=.lastTimestamp >"$EVIDENCE_DIR/events.txt" 2>&1 || true
          kubectl -n fitpilot get pdb,hpa,networkpolicy,ingress -o yaml >"$EVIDENCE_DIR/policies.yaml" 2>&1 || true
      - name: Upload production delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-delivery-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
