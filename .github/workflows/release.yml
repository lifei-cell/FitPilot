name: Release Image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release candidate
        shell: pwsh
        run: ./scripts/run-quality-gate.ps1
      - name: Build image for security gate
        run: docker build --build-arg APP_VERSION=${GITHUB_REF_NAME} --build-arg GIT_REVISION=${GITHUB_SHA} -t fitpilot:release-candidate .
      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fitpilot:release-candidate
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Build and scan web release candidate
        run: docker build -t fitpilot-web:release-candidate web
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fitpilot-web:release-candidate
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fitpilot
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_REVISION=${{ github.sha }}
            GITHUB_REPOSITORY=${{ github.repository }}
          provenance: mode=max
          sbom: true
      - id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fitpilot-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - id: web-build
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Verify published digests and create release manifest
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/fitpilot
          APP_DIGEST: ${{ steps.build.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/fitpilot-web
          WEB_DIGEST: ${{ steps.web-build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$APP_IMAGE@$APP_DIGEST"
          docker buildx imagetools inspect "$WEB_IMAGE@$WEB_DIGEST"
          mkdir -p release-evidence
          jq -n \
            --arg repository "${{ github.repository }}" \
            --arg revision "${{ github.sha }}" \
            --arg appImage "$APP_IMAGE" \
            --arg appDigest "$APP_DIGEST" \
            --arg webImage "$WEB_IMAGE" \
            --arg webDigest "$WEB_DIGEST" \
            '{schemaVersion: 1, repository: $repository, revision: $revision,
              app: {image: $appImage, digest: $appDigest, reference: ($appImage + "@" + $appDigest)},
              web: {image: $webImage, digest: $webDigest, reference: ($webImage + "@" + $webDigest)}}' \
            >release-evidence/release-manifest.json
          sha256sum release-evidence/release-manifest.json >release-evidence/release-manifest.sha256
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-digests-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fitpilot
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fitpilot-web
          subject-digest: ${{ steps.web-build.outputs.digest }}
          push-to-registry: true
