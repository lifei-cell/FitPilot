server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: fitpilot
    static_configs:
      - targets: [localhost]
        labels:
          job: fitpilot
          service: app
          __path__: /var/log/fitpilot/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
            requestId: requestId
      - labels:
          level:

