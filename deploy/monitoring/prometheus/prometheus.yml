global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fitpilot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
