apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fitpilot
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fitpilot}
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}

