apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitpilot-web
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fitpilot-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fitpilot-web}
    spec:
      serviceAccountName: fitpilot
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/example/fitpilot-web:5.1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: cache
          emptyDir: {sizeLimit: 16Mi}
