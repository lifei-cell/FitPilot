apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fitpilot
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: fitpilot}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: fitpilot-web}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: fitpilot-delivery-verifier}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 9091}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9200}
        - {protocol: TCP, port: 4318}
