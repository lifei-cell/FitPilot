apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fitpilot-web
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: fitpilot-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: fitpilot}
      ports: [{protocol: TCP, port: 8080}]
