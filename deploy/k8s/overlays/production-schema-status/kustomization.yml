apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../production-migration
patches:
  - target: {group: batch, version: v1, kind: Job, name: fitpilot-migrate}
    patch: |-
      - op: replace
        path: /metadata/name
        value: fitpilot-schema-status
      - op: replace
        path: /spec/backoffLimit
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/command/1
        value: -Dloader.main=com.fitpilot.deployment.FlywaySchemaStatusMain
