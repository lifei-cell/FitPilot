apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../production-migration
patches:
  - target: {group: batch, version: v1, kind: Job, name: fitpilot-migrate}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/command/-
        value: --quiesced-for-v22
