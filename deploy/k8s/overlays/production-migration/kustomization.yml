apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fitpilot
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: fitpilot}
      $patch: delete
images:
  - name: ghcr.io/example/fitpilot
    newName: ghcr.io/example/fitpilot
    newTag: 5.0.0
