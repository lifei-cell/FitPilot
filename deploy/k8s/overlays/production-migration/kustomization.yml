apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fitpilot
resources:
  - ../../base
patches:
  - target: {version: v1, kind: ConfigMap, name: fitpilot-config}
    patch: |-
      - op: replace
        path: /metadata/name
        value: fitpilot-migration-config
  - target: {group: batch, version: v1, kind: Job, name: fitpilot-migrate}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: fitpilot-migration-config
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: fitpilot-web}
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata: {name: fitpilot-web}
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: fitpilot-web}
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata: {name: app}
      $patch: delete
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: fitpilot}
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: fitpilot}
      $patch: delete
images:
  - name: ghcr.io/example/fitpilot
    newName: ghcr.io/example/fitpilot
    newTag: 5.0.0
