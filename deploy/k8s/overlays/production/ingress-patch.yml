apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitpilot
spec:
  rules:
    - host: fitpilot.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: fitpilot, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: fitpilot-web, port: {name: http}}
