apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: deployment-patch.yml
  - path: hpa-patch.yml
  - path: ingress-patch.yml
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: fitpilot-migrate
      $patch: delete
images:
  - name: ghcr.io/example/fitpilot
    newName: ghcr.io/example/fitpilot
    newTag: 5.0.0
  - name: ghcr.io/example/fitpilot-web
    newName: ghcr.io/example/fitpilot-web
    newTag: 5.1.0
