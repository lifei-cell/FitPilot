apiVersion: batch/v1
kind: Job
metadata:
  name: fitpilot-secret-rotation-check
  namespace: fitpilot
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: fitpilot-delivery-verifier}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: ghcr.io/example/fitpilot:5.0.0
          command: ["sh", "-ec"]
          args:
            - |
              endpoint=http://fitpilot/api/v1/operations/llm/status
              attempt=0
              new_status=000
              old_status=000
              while [ "$attempt" -lt 15 ]; do
                new_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --header "X-Operations-Token: $OPERATIONS_TOKEN" "$endpoint" || true)
                old_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --header "X-Operations-Token: $PREVIOUS_OPERATIONS_TOKEN" "$endpoint" || true)
                if [ "$new_status" = "200" ] && [ "$old_status" = "403" ]; then break; fi
                attempt=$((attempt + 1))
                sleep 2
              done
              echo "NEW_OPERATIONS_TOKEN_STATUS=$new_status"
              echo "PREVIOUS_OPERATIONS_TOKEN_STATUS=$old_status"
              test "$new_status" = "200"
              test "$old_status" = "403"
              echo "SECRET_ROTATION_AUTH_CHECK=PASS"
          env:
            - name: OPERATIONS_TOKEN
              valueFrom: {secretKeyRef: {name: fitpilot-secrets, key: OPERATIONS_TOKEN}}
            - name: PREVIOUS_OPERATIONS_TOKEN
              valueFrom: {secretKeyRef: {name: fitpilot-secrets, key: PREVIOUS_OPERATIONS_TOKEN}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
