services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fitpilot
      POSTGRES_PASSWORD: ${DELIVERY_DB_PASSWORD:?DELIVERY_DB_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpilot -d fitpilot"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
