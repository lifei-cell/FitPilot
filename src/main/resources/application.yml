spring:
  application:
    name: fitpilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitpilot}
    username: ${DB_USERNAME:fitpilot}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  flyway:
    enabled: true
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
fitpilot:
  rag:
    enabled: ${RAG_ENABLED:true}
    operations-token: ${RAG_OPERATIONS_TOKEN:${EVENT_OPERATIONS_TOKEN:}}
    elasticsearch:
      url: ${RAG_ELASTICSEARCH_URL:http://localhost:9200}
      index: ${RAG_ELASTICSEARCH_INDEX:fitpilot-knowledge-v1}
      connect-timeout-ms: ${RAG_ES_CONNECT_TIMEOUT_MS:1000}
      request-timeout-ms: ${RAG_ES_REQUEST_TIMEOUT_MS:3000}
    embedding:
      provider: ${EMBEDDING_PROVIDER:LOCAL}
      dimensions: ${EMBEDDING_DIMENSIONS:384}
      api-url: ${EMBEDDING_API_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:10}
    chunking:
      parent-max-chars: ${RAG_PARENT_MAX_CHARS:2400}
      child-max-chars: ${RAG_CHILD_MAX_CHARS:700}
      child-overlap-chars: ${RAG_CHILD_OVERLAP_CHARS:100}
    retrieval:
      candidate-limit: ${RAG_CANDIDATE_LIMIT:30}
      rrf-k: ${RAG_RRF_K:60}
      max-top-k: ${RAG_MAX_TOP_K:20}
    indexing:
      fixed-delay-ms: ${RAG_INDEX_FIXED_DELAY_MS:5000}
      retry-batch-size: ${RAG_INDEX_RETRY_BATCH_SIZE:20}
  events:
    enabled: ${EVENTS_ENABLED:true}
    operations-token: ${EVENT_OPERATIONS_TOKEN:}
    relay:
      batch-size: ${OUTBOX_BATCH_SIZE:100}
      fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:500}
      claim-timeout-seconds: ${OUTBOX_CLAIM_TIMEOUT_SECONDS:30}
      send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:5}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:20}
    consumer:
      concurrency: ${EVENT_CONSUMER_CONCURRENCY:3}
      retry-interval-ms: ${EVENT_RETRY_INTERVAL_MS:1000}
      max-attempts: ${EVENT_RETRY_MAX_ATTEMPTS:3}
  performance:
    cache:
      enabled: ${CACHE_ENABLED:true}
      l1-maximum-size: ${CACHE_L1_MAXIMUM_SIZE:10000}
      l1-ttl-seconds: ${CACHE_L1_TTL_SECONDS:300}
      l2-ttl-seconds: ${CACHE_L2_TTL_SECONDS:1800}
      l2-ttl-jitter-seconds: ${CACHE_L2_TTL_JITTER_SECONDS:300}
      rebuild-lock-seconds: ${CACHE_REBUILD_LOCK_SECONDS:5}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      api-capacity: ${RATE_LIMIT_API_CAPACITY:400}
      api-refill-per-second: ${RATE_LIMIT_API_REFILL_PER_SECOND:200}
      login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      login-refill-per-second: ${RATE_LIMIT_LOGIN_REFILL_PER_SECOND:5}
    idempotency:
      enabled: ${IDEMPOTENCY_ENABLED:true}
      result-ttl-seconds: ${IDEMPOTENCY_RESULT_TTL_SECONDS:86400}
      processing-ttl-seconds: ${IDEMPOTENCY_PROCESSING_TTL_SECONDS:30}
    leaderboard:
      ttl-seconds: ${LEADERBOARD_TTL_SECONDS:600}
